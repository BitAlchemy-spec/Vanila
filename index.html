<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кастомный Select</title>
  <style>
    :root {
      --select-height: 2.75rem; /* 44px */
      --select-padding-x: 0.875rem; /* 14px */
      --select-radius: 0.625rem; /* 10px */
      --select-bg: #ffffff;
      --select-border: #d0d5dd;
      --select-text: #101828;
      --select-focus: #155eef;
      --select-hover: #c2c8d0;
      --select-disabled-bg: #f2f4f7;
      --ring-alpha: 22%;
      --ring-size: 0.25rem; /* 4px */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem; /* 32px */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: #f8fafc;
      color: #0f172a;
    }

    .select {
      max-width: 26.25rem; /* 420px */
    }

    /* Размеры через модификаторы блока */
    .select_size_s .select__control { --select-height: 2.25rem; font-size: 0.875rem; }
    .select_size_m .select__control { --select-height: 2.75rem; font-size: 1rem; }
    .select_size_l .select__control { --select-height: 3.25rem; font-size: 1.125rem; }

    .select__label {
      display: block;
      margin-bottom: 0.5rem; /* 8px */
      font-weight: 600;
      color: #0f172a;
    }

    .select__wrapper {
      position: relative;
    }

    .select__control {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      height: var(--select-height);
      padding: 0 calc(var(--select-padding-x) + 28px) 0 var(--select-padding-x);
      border: 0.0625rem solid var(--select-border); /* 1px */
      border-radius: var(--select-radius);
      background-color: var(--select-bg);
      color: var(--select-text);
      line-height: 1.2;
      font-size: 1rem;
      transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease, color .15s ease;
      box-shadow: 0 0.0625rem 0.125rem rgba(0,0,0,.04); /* 0 1px 2px */
    }

    .select__control:hover {
      border-color: var(--select-hover);
    }

    .select__control:focus { outline: none; }
    .select__control:focus-visible {
      border-color: var(--select-focus);
      box-shadow: 0 0 0 var(--ring-size) color-mix(in oklab, var(--select-focus) var(--ring-alpha), transparent);
    }

    .select__control:disabled {
      background: var(--select-disabled-bg);
      color: #667085;
      cursor: not-allowed;
    }

    .select__icon {
      position: absolute;
      inset-inline-end: 0.625rem; /* 10px */
      top: 50%;
      width: 1.125rem; /* 18px */
      height: 1.125rem; /* 18px */
      color: #475467;
      pointer-events: none;
      transform: translateY(-50%);
      transition: color .15s ease, transform .15s ease;
    }

    .select__icon::before {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      background: currentColor;
      -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="black" d="M7 10l5 5 5-5"/></svg>') center/contain no-repeat;
              mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="black" d="M7 10l5 5 5-5"/></svg>') center/contain no-repeat;
    }

    .select__help {
      margin-top: 0.375rem; /* 6px */
      font-size: 0.75rem; /* 12px */
      color: #667085;
      display: block;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity .2s ease, max-height .2s ease, color .15s ease;
    }

    /* Состояние ошибки через :invalid */
    .select__control:invalid { border-color: #f04438; }
    .select__control:invalid + .select__icon { color: #f04438; }
    .select:has(.select__control:invalid) .select__help {
      opacity: 1;
      max-height: 2.5rem; /* 40px */
      color: #f04438;
    }

    /* Дополнительно подсвечиваем валидное состояние */
    .select__control:valid { border-color: #16a34a; }
    .select__control:valid + .select__icon { color: #16a34a; }

    /* Намёк на раскрытие: разворот стрелки при фокусе */
    .select__control:focus-visible + .select__icon {
      transform: translateY(-50%) rotate(180deg);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --select-bg: #0b1220;
        --select-border: #283548;
        --select-text: #e2e8f0;
        --select-hover: #3a4a63;
        --select-disabled-bg: #0a0f1a;
      }
      body { background: #0b1020; color: #e2e8f0; }
      .select__label { color: #e2e8f0; }
      .select__help { color: #94a3b8; }
      .select__icon { color: #94a3b8; }
    }

    /* Сниженное движение */
    @media (prefers-reduced-motion: reduce) {
      .select__icon,
      .select__help,
      .select__control { transition: none; }
    }

    /* Высокая контрастность/форсированные цвета */
    @media (forced-colors: active) {
      .select__control { border: 0.0625rem solid CanvasText; }
      .select__control:focus-visible { outline: 0.0625rem solid Highlight; box-shadow: none; }
      .select__icon { color: CanvasText; }
    }

    /* Кнопка без инлайновых стилей */
    .button {
      height: var(--select-height);
      padding: 0 1rem;
      border: 0.0625rem solid var(--select-border);
      border-radius: var(--select-radius);
      background: var(--select-bg);
      color: var(--select-text);
      cursor: pointer;
      box-shadow: 0 0.0625rem 0.125rem rgba(0,0,0,.04);
      transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .button:hover { border-color: var(--select-hover); }
    .button:focus { outline: none; }
    .button:focus-visible {
      border-color: var(--select-focus);
      box-shadow: 0 0 0 var(--ring-size) color-mix(in oklab, var(--select-focus) var(--ring-alpha), transparent);
    }

    /* Простой отступ-спейсер */
    .spacer { height: 1.5rem; }
  </style>
</head>
  <body>
  <form action="#" method="get">
    <div class="select">
      <label class="select__label" for="country">Выберите страну</label>
      <div class="select__wrapper">
        <select
          class="select__control"
          id="country"
          name="country"
          aria-describedby="country-help"
          required
        >
          <option value="" disabled selected>Выберите страну</option>
          <option value="ua">Украина</option>
          <option value="pl">Польша</option>
        </select>
        <span class="select__icon" aria-hidden="true"></span>
      </div>
      <p class="select__help" id="country-help">Пожалуйста, выберите страну.</p>
    </div>

    <div class="spacer"></div>

    <button type="submit" class="button">
      Отправить
    </button>

  </form>
</body>
</html>
